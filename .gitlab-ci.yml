include:
  - template: Workflows/MergeRequest-Pipelines.gitlab-ci.yml

stages:
  - test
  - publish

variables:
  HELM_INSTALL_IMAGE: registry.gitlab.com/gitlab-org/cluster-integration/helm-install-image:helm-3.10.2-kube-1.24.8-alpine-3.15

lint:helm:
  image: $HELM_INSTALL_IMAGE
  script:
    - helm lint

publish:
  stage: publish
  script:
    - curl --request POST
      --form "token=${CHARTS_TRIGGER_TOKEN}"
      --form ref=master
      --form "variables[CHART_NAME]=${CI_PROJECT_NAME}"
      --form "variables[RELEASE_REF]=${CI_COMMIT_REF_NAME}"
      https://gitlab.com/api/v4/projects/2860651/trigger/pipeline
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$/ && $CI_PROJECT_URL == "https://gitlab.com/gitlab-org/charts/gitlab-agent"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$/ && $CI_PROJECT_URL == "https://gitlab.com/gitlab-org/security/charts/gitlab-agent"'

.helm_repo_setup: &helm_repo_setup
  - helm repo add gitlab https://charts.gitlab.io
  - helm repo update

.create_secret_when_needed: &create_secret_when_needed
  - if [[ "$HELM_VALUE" == "config.secretName"* ]]; then kubectl create secret generic test-secret --from-literal=token='FAKE-AGENT-TOKEN'; fi

.helm_install_from_local_dir: &helm_install_from_local_dir
  - *create_secret_when_needed
  - helm install gitlab-agent . --wait --set config.kasAddress='wss://kas.gitlab.test' --set "$HELM_VALUE"

.helm_install_published_chart: &helm_install_published_chart
  - *helm_repo_setup
  - *create_secret_when_needed
  - helm upgrade --install gitlab-agent gitlab/gitlab-agent --wait --set config.kasAddress='wss://kas.gitlab.test' --set "$HELM_VALUE"

.helm_upgrade_from_local_dir: &helm_upgrade_from_local_dir
  - helm upgrade gitlab-agent . --wait --reuse-values

test:local:install:
  extends: .k3s
  script:
    - *helm_install_from_local_dir

test:local:upgrade:
  extends: .k3s
  script:
    - *helm_install_from_local_dir
    - *helm_upgrade_from_local_dir

test:breaking:upgrade:
  extends: .k3s
  script:
    - *helm_install_published_chart
    - *helm_upgrade_from_local_dir

.k3s:
  stage: test
  image: $HELM_INSTALL_IMAGE
  services:
    - name: registry.gitlab.com/gitlab-org/cluster-integration/test-utils/k3s-gitlab-ci/releases/v1.25.0-k3s1
      alias: k3s
  before_script:
    - apk add --update --no-cache curl
    # NOTE: libcurl in the job image is v7.x which is too old for the installed curl v7.x
    - apk upgrade libcurl
    - curl -f k3s:8081 > k3s.yaml
    - export KUBECONFIG=$(pwd)/k3s.yaml
    - kubectl version
    - kubectl cluster-info
  parallel:
    matrix:
      - NAME: with token
        HELM_VALUE: config.token='FAKE-AGENT-TOKEN'
      - NAME: with pre-defined secret
        HELM_VALUE: config.secretName='test-secret'
